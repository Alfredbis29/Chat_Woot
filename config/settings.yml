# =============================================================================
# Application Configuration
# =============================================================================
# Environment-specific overrides should be defined in settings.local.yml
# DO NOT commit secrets or credentials here — use credentials.yml.enc instead
# =============================================================================

app:
  name: "ChatWoot"
  version: "1.0.0"
  environment: <%= Rails.env %>
  base_url: <%= ENV.fetch("APP_BASE_URL", "http://localhost:3000") %>
  support_email: <%= ENV.fetch("SUPPORT_EMAIL", "support@chatwoot.com") %>

features:
  articles_enabled: true
  categories_enabled: true
  search_enabled: true
  analytics_enabled: false

pagination:
  per_page: 20
  max_per_page: 100

performance:
  cache_ttl: 3600
  db_query_timeout: 30

security:
  password_min_length: 12
  session_timeout: 1800
  csrf_protection: true

logging:
  level: <%= Rails.env.production? ? 'info' : 'debug' %>
  include_params: false
  include_headers: true
